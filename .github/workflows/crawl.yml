# Crawls the stores and saves deals to the Postgres database (DATA_STORE=postgres) for the website
# on Vercel. There is no schedule: it runs only from the Actions tab or when the owner presses
# Refresh on the site (src/github.js).
name: Crawl stores

on:
  workflow_dispatch:
    inputs:
      segment:
        description: 'Sections to refresh, comma-separated (groceries, clothing, electronics, food); empty = all'
        required: false
        default: ''
      trigger:
        description: 'Recorded in the refresh history'
        required: false
        default: 'manual'

# One crawl at a time; a second request waits for the first instead of running in parallel.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_STORE: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NUXT_HF_TOKEN: ${{ secrets.NUXT_HF_TOKEN }}
      NUXT_HF_MODEL: ${{ secrets.NUXT_HF_MODEL }}
      TZ: Europe/Helsinki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Crawl
        # Inputs arrive as environment variables (never pasted into the script) and are checked.
        env:
          SEG_INPUT: ${{ inputs.segment }}
          TRIGGER_INPUT: ${{ inputs.trigger }}
        run: |
          SEG="$SEG_INPUT"
          TRIGGER="${TRIGGER_INPUT:-manual}"
          case "$SEG" in *[!a-z,]*) echo "Invalid segment: $SEG"; exit 1;; esac
          case "$TRIGGER" in schedule|manual|cli) ;; *) TRIGGER=manual;; esac
          if [ -n "$SEG" ]; then npm run crawl -- --segment "$SEG" --trigger "$TRIGGER" --skip-failed; else npm run crawl -- --trigger "$TRIGGER" --skip-failed; fi
