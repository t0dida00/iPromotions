# Crawls the stores and saves deals to the Postgres database (DATA_STORE=postgres) for the website
# on Vercel. Runs on a schedule, from the Actions tab, or when the owner presses Refresh on the site
# (src/github.js). GitHub cron is in UTC: 04:00 UTC = 06:00 Helsinki in winter, 07:00 in summer.
name: Crawl stores

on:
  schedule:
    - cron: '0 4 * * 3' # Wednesday: every store except Food (config.schedule)
    - cron: '0 7 * * *' # daily: Food (config.sectionSchedules.food)
  workflow_dispatch:
    inputs:
      segment:
        description: 'Sections to refresh, comma-separated (groceries, clothing, electronics, food); empty = all'
        required: false
        default: ''
      trigger:
        description: 'Recorded in the refresh history'
        required: false
        default: 'manual'

# One crawl at a time; a second request waits for the first instead of running in parallel.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_STORE: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NUXT_HF_TOKEN: ${{ secrets.NUXT_HF_TOKEN }}
      NUXT_HF_MODEL: ${{ secrets.NUXT_HF_MODEL }}
      TZ: Europe/Helsinki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Crawl
        # Inputs arrive as environment variables (never pasted into the script) and are checked.
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          SEG_INPUT: ${{ inputs.segment }}
          TRIGGER_INPUT: ${{ inputs.trigger }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$CRON" = "0 7 * * *" ]; then SEG=food; else SEG=groceries,clothing,electronics; fi
            TRIGGER=schedule
          else
            SEG="$SEG_INPUT"
            TRIGGER="${TRIGGER_INPUT:-manual}"
          fi
          case "$SEG" in *[!a-z,]*) echo "Invalid segment: $SEG"; exit 1;; esac
          case "$TRIGGER" in schedule|manual|cli) ;; *) TRIGGER=manual;; esac
          if [ -n "$SEG" ]; then npm run crawl -- --segment "$SEG" --trigger "$TRIGGER"; else npm run crawl -- --trigger "$TRIGGER"; fi
